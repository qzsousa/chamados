services:
  - type: web
    name: sci-chamados-api
    env: node
    plan: free
    buildCommand: |
      cd /opt/render/project/src/shared/types && npm ci && npx tsc -p tsconfig.json
      cd /opt/render/project/src/backend && npm ci
      cp -r /opt/render/project/src/shared/types/dist /opt/render/project/src/backend/node_modules/@shared
      echo '{"name":"@shared/api","main":"api.js","types":"api.d.ts"}' > /opt/render/project/src/backend/node_modules/@shared/package.json
      npm run build && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: sci-chamados-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sci-chamados-frontend.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false

databases:
  - name: sci-chamados-db
    plan: free
    databaseName: sci_chamados
    user: sci_chamados_user