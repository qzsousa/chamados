services:
  - type: web
    name: sci-chamados-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sci-chamados-api.onrender.com/api
      - key: VITE_SENTRY_DSN
        sync: false