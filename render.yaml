services:
  - type: web
    name: sci-chamados-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |
      cd /opt/render/project/src/shared/types && NODE_ENV=development npm ci && npm run build
      cd /opt/render/project/src/backend && NODE_ENV=development npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://chamados-lac-delta.vercel.app
      - key: SENTRY_DSN
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEETS_ID
        value: 1HyfNcETaINc0ZKcvM0pUPqlv94gwkNlYlwIpvCBxV8o
      - key: GOOGLE_INVENTARIO_SHEETS_ID
        value: 1W9_Q8F6k0Ic7OG5dpgEIGbEzmJwjExv-S07gJptv9SY
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # Host e porta do SMTP nao sao segredo: podem ser fixados aqui para
      # reduzir o que voce digita no painel. O usuario e a senha de APP vao
      # como segredo.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: chamadossetec@gmail.com
      # Sincronizacao de usuarios do portal -> SCE.
      # Sem o SCE_API_URL o sync de usuarios nao roda, e o SSO do SCE nao
      # encontra o perfil. Ver src/services/sceSync.ts.
      # ATENCAO: se o SCE tambem mudar de workspace, a URL muda e este valor
      # precisa ser atualizado aqui e o servico redeployado.
      - key: SCE_API_URL
        value: https://sce-nyjc.onrender.com
      - key: SCE_SYNC_KEY
        sync: false